<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAVED // DARK SYSTEM</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#020204;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

/* ===== LOADER ===== */
#loader{
  position:fixed;
  inset:0;
  background:#000;
  z-index:99999;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:1s ease;
}

.loader-title{
  font-size:25px;
  font-weight:900;
  letter-spacing:6px;
  color:#ff1744;
  text-shadow:
    0 0 10px #ff1744,
    0 0 30px #ff1744;
  animation:pulse 1s infinite alternate;
}

.loader-sub{
  margin-top:12px;
  color:#777;
  font-size:11px;
  letter-spacing:3px;
}

.loader-bar{
  width:230px;
  height:4px;
  margin-top:25px;
  background:#151515;
  overflow:hidden;
  border-radius:10px;
}

.loader-bar span{
  display:block;
  width:0;
  height:100%;
  background:#ff1744;
  box-shadow:0 0 20px #ff1744;
  animation:loading 2.5s forwards;
}

@keyframes loading{
  to{width:100%;}
}

@keyframes pulse{
  from{transform:scale(1);}
  to{transform:scale(1.05);}
}

/* ===== BACKGROUND ===== */
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-2;
}

.bg-glow{
  position:fixed;
  width:450px;
  height:450px;
  background:#ff1744;
  opacity:.07;
  filter:blur(120px);
  border-radius:50%;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  z-index:-1;
}
