<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚠️ JAVED // DARK MODE</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#000;
  color:white;
  overflow:hidden;
}

.hero{
  height:100vh;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.88)),
    url("https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=4000&q=100")
    center/cover;
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(255,0,0,.035) 4px
    );
  pointer-events:none;
}

.content{
  position:relative;
  z-index:2;
  width:90%;
  max-width:800px;
}

.warning{
  color:#ff1717;
  font-size:14px;
  letter-spacing:6px;
  font-weight:bold;
  animation:blink 1s infinite;
}

h1{
  font-size:clamp(45px,10vw,110px);
  line-height:.9;
  margin:25px 0;
  text-transform:uppercase;
  text-shadow:
    4px 0 #ff0000,
    -4px 0 #400000,
    0 0 35px red;
  animation:glitch 1.8s infinite;
}

.subtitle{
  color:#ddd;
  font-size:18px;
  letter-spacing:3px;
  margin-bottom:35px;
}

button{
  border:1px solid red;
  background:#080000;
  color:#ff2020;
  padding:16px 30px;
  font-size:16px;
  font-weight:bold;
  letter-spacing:3px;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 0 20px rgba(255,0,0,.3);
}

button:hover{
  background:red;
  color:#000;
  box-shadow:0 0 40px red;
  transform:scale(1.08);
}

#secret{
  display:none;
  margin-top:30px;
  padding:25px;
  border:1px solid #ff0000;
  background:rgba(0,0,0,.75);
  box-shadow:0 0 40px rgba(255,0,0,.4);
}
