body{

/* LOADING */
#loader{
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  transition:1s;
}

.loaderText{
  color:#ff1744;
  font-size:24px;
  letter-spacing:4px;
  text-shadow:0 0 20px #ff1744;
}

.bar{
  width:220px;
  height:4px;
  background:#111;
  margin-top:20px;
  overflow:hidden;
}

.bar span{
  display:block;
  height:100%;
  width:0;
  background:#ff1744;
  box-shadow:0 0 15px #ff1744;
  animation:load 2.5s forwards;
}

@keyframes load{
  to{width:100%}
}

/* BACKGROUND */
canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}
